name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run checks
        run: nix flake check -L --no-update-lock-file

  build:
    name: build ${{ matrix.package }}
    needs: check
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package: [linux-amlogic, kodi-amlogic]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.flox.dev https://nix-community.cachix.org
            extra-trusted-public-keys = flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build package
        run: nix build -L --no-link --no-update-lock-file --max-jobs 1 .#${{ matrix.package }}
