version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      coreelec:
        patterns:
          - "coreelec*"
      nixpkgs:
        patterns:
          - "nixpkgs"
      tooling:
        patterns:
          - "flake-parts"
          - "git-hooks"
          - "treefmt-nix"
